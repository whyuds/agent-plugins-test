<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update Probe · MCP UI</title>
  <style>
    :root{color-scheme:light dark;--bg:#fff;--text:#16302e;--muted:#5b7370;--line:#dce8e5;--soft:#f3f8f6;--accent:#0f766e}
    *{box-sizing:border-box}body{margin:0;padding:18px;font:14px/1.5 system-ui,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
    main{max-width:740px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:14px}.identity{display:flex;gap:12px;align-items:center}
    .icon{width:42px;height:42px;display:grid;place-items:center;background:var(--accent);border-radius:12px;color:white;font-size:25px;font-weight:600}h1{font-size:20px;margin:0;letter-spacing:-.5px}p{margin:0}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:1.6px;font-weight:700}.badge{border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--muted);white-space:nowrap}
    .versions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 12px}.tile{border:1px solid var(--line);border-radius:12px;padding:15px}.tile:first-child{background:var(--soft)}.label{color:var(--muted);font-size:12px}.version{font-size:28px;font-weight:700;letter-spacing:-1px;margin:3px 0}.marker{color:var(--accent);font:12px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}
    #status{background:var(--soft);padding:10px 12px;border-radius:8px;color:var(--muted);font-size:12px;min-height:38px}#status[data-state=error]{background:#fff0ef;color:#b42318}#status[data-state=ok]{color:var(--accent)}
    .controls{margin:18px 0 0;padding:16px;border:1px solid var(--line);border-radius:12px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}input:focus{outline:2px solid var(--accent);outline-offset:2px}.nonce-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.sum-row{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:end;margin-top:14px}button{font:600 12px/1.5 system-ui,sans-serif;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);padding:11px 14px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.45;cursor:wait}.plus{padding-bottom:10px;color:var(--muted)}.result{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);margin-top:16px;padding-top:12px}.result strong{font:700 23px ui-monospace,monospace;color:var(--accent)}
    details{margin-top:14px;font-size:12px;color:var(--muted)}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.6 ui-monospace,monospace;background:var(--soft);padding:12px;border-radius:8px}footer{color:var(--muted);font-size:11px;margin-top:14px}#preview-note{color:#9a6700;margin-bottom:12px;font-size:12px}
    @media(max-width:480px){body{padding:12px}.badge{display:none}.nonce-row{grid-template-columns:1fr}.sum-row{grid-template-columns:1fr auto 1fr}.sum-row button{grid-column:1/-1}.version{font-size:24px}}
    @media(prefers-color-scheme:dark){:root{--bg:#152320;--text:#e0efea;--muted:#9cb6af;--line:#355049;--soft:#1e332d;--accent:#26b8a1}#status[data-state=error]{background:#452826;color:#ffc2b9}}
    :root[data-theme=light]{color-scheme:light;--bg:#fff;--text:#16302e;--muted:#5b7370;--line:#dce8e5;--soft:#f3f8f6;--accent:#0f766e}
    :root[data-theme=dark]{color-scheme:dark;--bg:#152320;--text:#e0efea;--muted:#9cb6af;--line:#355049;--soft:#1e332d;--accent:#26b8a1}
  </style>
</head>
<body><main>
  <p id="preview-note" hidden>协议测试宿主 · 非 Codex / Cursor / VS Code 实机验收</p>
  <header><div class="identity"><div class="icon" aria-hidden="true">↗</div><div><p class="eyebrow">PLUGIN UPDATE LAB</p><h1>Update Probe</h1></div></div><span class="badge">OFFLINE · READ ONLY</span></header>
  <section class="versions" aria-label="版本对照">
    <div class="tile"><p class="label">卡片自身 · UI</p><p class="version" id="ui-version">__UI_VERSION__</p><p class="marker" id="ui-marker">__UI_MARKER__</p></div>
    <div class="tile"><p class="label">实际响应 · MCP 服务</p><p class="version" id="server-version">等待回执</p><p class="marker" id="server-marker">尚未读取</p></div>
  </section>
  <p id="status" role="status" aria-live="polite">正在连接宿主的 MCP Apps 桥接…</p>
  <section class="controls" aria-label="真实 MCP 调用">
    <div class="nonce-row"><div><label for="nonce">测试标记 nonce（不要输入敏感信息）</label><input id="nonce" maxlength="120" autocomplete="off" value="ui-test"></div><button id="refresh" disabled>刷新服务版本</button></div>
    <div class="sum-row"><div><label for="a">整数 A</label><input id="a" type="number" min="-1000000" max="1000000" step="1" value="7"></div><span class="plus">+</span><div><label for="b">整数 B</label><input id="b" type="number" min="-1000000" max="1000000" step="1" value="5"></div><button id="sum" class="primary" disabled>通过 MCP 计算</button></div>
    <div class="result"><span class="label">服务端计算结果（非前端演示值）</span><strong id="answer">—</strong></div>
  </section>
  <details><summary>查看回执与缓存诊断</summary><pre id="receipt">尚无工具回执。</pre></details>
  <footer>三个层次独立核对：Skill 标记 → MCP 服务 → UI 卡片。无需登录，不访问业务系统。</footer>
</main><script>__APP_BUNDLE__</script></body>
</html>
